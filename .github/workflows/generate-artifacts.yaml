name: Release for Linux, Windows, and macOS

on:
  release:
    types: [ published ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test with Gradle
        run: ./gradlew :launcher-gui:runtimeZip --no-daemon

      - name: Rename image
        run: mv build/image.zip build/taulauncher-${{ matrix.os }}.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/taulauncher-${{ matrix.os }}.zip